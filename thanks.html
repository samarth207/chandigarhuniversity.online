<!DOCTYPE html>
<html lang="en" class="h-100">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thank You - Chandigarh University Online</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="shortcut icon" href="assets/images/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/header-footer.css">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-V2XD1YSG1H"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-V2XD1YSG1H');
        gtag('event', 'conversion', { 'send_to': 'G-V2XD1YSG1H' });
    </script>
    <style>
        body { font-family: 'Google Sans', Arial, sans-serif; }
        .thank-you-section {
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px;
        }
        .thank-you-section h1 {
            color: #e0181e;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .thank-you-section p {
            font-size: 1.1rem;
            color: #444;
            max-width: 600px;
            margin: 0 auto 30px;
        }
        .thank-you-section .program-name {
            font-size: 1.15rem;
            color: #e0181e;
            font-weight: 600;
            margin-bottom: 25px;
        }
        .thank-you-section .btn-home {
            display: inline-block;
            padding: 12px 30px;
            background-color: #e0181e;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
        }
        .thank-you-section .btn-home:hover {
            background-color: #c01518;
            color: #fff;
        }
        .thank-you-section .check-icon {
            width: 80px;
            height: 80px;
            background-color: #28a745;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
        }
        .thank-you-section .check-icon svg {
            width: 40px;
            height: 40px;
            fill: white;
        }
    </style>
</head>
<body>
    <div class="thank-you-section">
        <div>
            <div class="check-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
            </div>
            <h1>Thank You!</h1>
            <p id="programInfo" style="display:none;"></p>
            <p>Your application has been submitted successfully. Our admissions team will contact you shortly.</p>
            <p style="font-size: 0.95rem; color: #666;">For any queries, reach us at <a href="mailto:helpdesk@chandigarhuniversity.online">helpdesk@chandigarhuniversity.online</a> or call <a href="tel:9311381814">9311381814</a></p>
            <a href="index" class="btn-home">Back to Home</a>
        </div>
    </div>
    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            var program = params.get('p');
            if (program) {
                var el = document.getElementById('programInfo');
                el.textContent = 'Program: ' + decodeURIComponent(program);
                el.className = 'program-name';
                el.style.display = 'block';
            }
        })();
    </script>
</body>
</html>
